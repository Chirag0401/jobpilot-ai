name: Web app checks
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-check.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit test search and matching
        run: npm run test
      - name: Build
        run: npm run build
