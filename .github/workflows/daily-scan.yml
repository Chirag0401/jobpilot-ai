name: JobPilot daily scan
on:
  workflow_dispatch:
  schedule:
    # 02:30 UTC = 08:00 IST
    - cron: '30 2 * * *'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan public job feeds
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: python scout.py scan --freshness day --output results/jobs.json
      - uses: actions/upload-artifact@v4
        with:
          name: jobpilot-results
          path: results/jobs.json
          retention-days: 14
